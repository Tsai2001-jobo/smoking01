*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;color:var(--dark);font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,a{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #ad708d;outline-offset:3px}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f4e6e3}
.phone{height:100vh;height:100dvh;width:100%;max-width:460px;max-height:950px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fff8f4 0%,#f8e9e9 52%,#f0e8dc 100%);isolation:isolate;box-shadow:0 14px 42px #67495a33}
.page{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;animation:page-in .35s ease-out both;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
@keyframes page-in{from{opacity:.65;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.bg-campus{position:absolute;inset:0;z-index:-2;background-image:var(--campus);background-position:center 61%;background-size:cover;filter:saturate(.86) brightness(1.06)}
.bg-campus::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#fff8f4 0%,#fff8f4eb 16%,#fff8f4a8 34%,#fff8f40d 59%,#fff8f4bb 84%,#fff8f4 100%)}
.play-bg{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 82% 12%,#fff2d5 0%,transparent 40%),radial-gradient(ellipse at 6% 83%,#e4f3e1 0%,transparent 46%),linear-gradient(165deg,#fff8f4 0%,#fff2ee 58%,#eaf2e2 100%)}
.play-bg::after{content:"";position:absolute;bottom:-18px;left:-12%;width:124%;height:84px;border-radius:50% 50% 0 0;background:linear-gradient(#b8d7a5,#a0c28c);opacity:.28}
.float-deco{position:absolute;pointer-events:none;filter:drop-shadow(0 5px 4px #95627b31)}
.icon-sticker{width:69px;height:69px;border-radius:21px;background:linear-gradient(145deg,#fffef9,#fff0e9);border:3px solid #fff;display:grid;place-items:center;box-shadow:0 5px 0 #e4b6b6,0 10px 15px #72536340;transform:rotate(var(--rot,0deg));padding:8px}
.icon-sticker svg{width:100%;height:100%}
.home .sticker-a,.finish .sticker-a{top:33%;left:3%;--rot:-13deg}
.home .sticker-b,.finish .sticker-b{top:44%;right:4%;--rot:11deg}
.home .sticker-c,.finish .sticker-c{bottom:18%;left:5%;--rot:-8deg}
.home .flower-a,.finish .flower-a{bottom:12%;right:7%;width:65px;height:65px;transform:rotate(-10deg)}
.home .star-a,.finish .star-a{top:24%;right:9%;width:36px;height:36px;transform:rotate(20deg)}
.home .star-b,.finish .star-b{bottom:24%;right:10%;width:27px;height:27px;transform:rotate(-15deg)}
.brandbox{position:relative;z-index:2;text-align:center;padding-top:min(9vh,75px)}
.jelly-title{font-family:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;line-height:1.22;white-space:nowrap;margin:0;font-size:clamp(41px,12vw,62px);font-weight:1000;letter-spacing:-.045em;color:#dfa0b8;background:linear-gradient(180deg,#ffe5f0 1%,#f5c3d7 19%,#e69dbd 43%,#d47da4 72%,#af5d85 100%);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.1px #a36483;text-shadow:0 1px 0 #f9d6e5,1px 2px 0 #ce82a4,2px 4px 0 #ac6487,3px 6px 0 #965b79,0 10px 14px #81516d58;filter:drop-shadow(0 1px 0 #fff)}
.ribbon{margin:18px auto 0;display:table;padding:10px 25px;background:linear-gradient(160deg,#fffef4,#ffebd8);border-radius:25px 8px 25px 8px;border:2px solid #fdf9ef;box-shadow:0 4px 0 #dca7a1,0 9px 15px #8d666436;transform:rotate(-2deg);color:#79515d;font-size:17px;font-weight:900;letter-spacing:.055em}
.home-cta{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 7.5%);z-index:2;left:50%;transform:translateX(-50%);width:min(76%,295px)}
.big-btn{width:100%;min-height:64px;border-radius:22px;border:3px solid #fff6e9;color:#fffdf7;background:linear-gradient(180deg,#f5b6a0,#dc8c87 58%,#c97778 100%);font-size:23px;font-weight:950;letter-spacing:.1em;text-shadow:0 2px 2px #a85f6266;box-shadow:0 6px 0 #b36a71,0 12px 21px #9c526b50;transition:transform .14s,box-shadow .14s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b36a71,0 5px 13px #9c526b4d}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 48px}
.back{height:38px;min-width:81px;padding:0 9px;border-radius:999px;background:#fffaf4;border:2px solid #e9c5be;box-shadow:0 3px 0 #d9a9a7;color:#9c6b7a;font-size:13px;font-weight:900;display:grid;place-items:center;line-height:1;white-space:nowrap;flex-shrink:0}
.hud-title{font-size:17px;font-weight:1000;color:var(--berry);letter-spacing:.03em}
.stagebadge{background:#f8ddba;color:#9d6874;border:2px solid white;box-shadow:0 3px 0 #e6c6a3;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:1000}
.quest{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin:8px 0 12px;padding:10px 12px 10px 8px;background:linear-gradient(130deg,#fffef8,#ffefed);border:2px solid white;border-radius:22px;box-shadow:0 5px 0 #ebcfc7,0 9px 18px #ad878022}
.mascot{width:69px;height:67px;flex:0 0 69px;filter:drop-shadow(0 3px 2px #cda5a566)}
.quest h1{font-size:clamp(20px,5.2vw,25px);margin:0 0 4px;line-height:1.24;color:#754b5d;font-weight:1000}
.quest p{font-size:12.5px;color:#8a6a70;line-height:1.5;margin:0;font-weight:750}
.stage-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px;padding-bottom:8px}
.surface{background:#fffcf6e8;border:2px solid #fff;border-radius:25px;box-shadow:0 5px 0 #e4cfc5,0 9px 20px #916d6623;min-height:0}
.minilabel{font-size:12px;font-weight:900;letter-spacing:.04em;color:#9a777c}
.progress-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:900;color:#906a75;padding:0 4px}
.progress-track{flex:1;height:10px;background:#f3dfdf;border:2px solid #fff;box-shadow:inset 0 1px 3px #af8d8d33;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#95c58d,#b9dc9e);border-radius:99px;transition:width .3s}
.sort-baskets{flex:0 0 30%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.basket{min-height:0;border:3px solid #fff7e8;border-bottom:7px solid #d9a9a1;border-radius:21px;padding:9px 7px 7px;background:linear-gradient(165deg,#fbf6e6,#f7e8dc);box-shadow:0 5px 10px #b889813d;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;transition:transform .2s,filter .2s}
.basket:nth-child(2){background:linear-gradient(165deg,#eaf3e4,#dcebd3);border-bottom-color:#a9c99d}
.basket.ready{outline:3px dashed #b5769a;outline-offset:-1px;animation:glow 1.1s infinite alternate}
@keyframes glow{to{filter:brightness(1.075);box-shadow:0 5px 10px #b889813d, 0 0 0 3px #dfbadf66}}
.basket-title{font-size:clamp(18px,5.5vw,23px);font-weight:1000;color:#80546a;line-height:1.25}
.basket-sub{font-size:11px;color:#9a7980;line-height:1.25;font-weight:650}
.tokens{display:flex;flex-wrap:wrap;gap:3px;width:100%;justify-content:center;align-content:start;margin-top:2px;overflow:hidden}
.token{padding:4px 5px;background:#fffbf9;border:1px solid #e9cfcd;border-radius:10px;font-size:11px;font-weight:800;max-width:100%;line-height:1.2;box-shadow:0 2px 0 #ead2d0;color:#80576a}
.tray{flex:1;display:flex;flex-direction:column;gap:7px;padding:12px;min-height:0;position:relative;background:linear-gradient(150deg,#f6e3d9,#f5e8df);border:3px solid #fff7e9;border-bottom:7px solid #d8b6ac;border-radius:23px;box-shadow:0 8px 18px #9e81722f}
.tray-label{display:flex;align-items:center;justify-content:space-between;gap:6px;color:#9d6d76;font-weight:900;font-size:13px;line-height:1.2}
.card-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px}
.puzzle-piece{min-height:0;background:linear-gradient(135deg,#fffefb,#fff4eb);border:2px solid #fff;box-shadow:0 3px 0 #d9b6af,0 5px 7px #8d66662c;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,3.8vw,17px);font-weight:950;color:#785466;line-height:1.25;text-align:center;padding:4px 6px;transition:.15s;user-select:none;touch-action:none;position:relative}
.puzzle-piece:nth-child(3n+2){background:linear-gradient(135deg,#f3f9e9,#f9fff2)}
.puzzle-piece:nth-child(3n+3){background:linear-gradient(135deg,#fff0f4,#fff9fa)}
.puzzle-piece.chosen{transform:translateY(-2px);outline:3px solid #c97d9f;box-shadow:0 6px 0 #ad7891,0 8px 16px #a568814b;z-index:2}
.puzzle-piece:disabled{visibility:hidden}
.puzzle-piece.placeholder{visibility:hidden;pointer-events:none}
.toast{position:absolute;z-index:20;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:16px;right:16px;padding:12px 16px;border:3px solid #fff9f2;border-radius:18px;box-shadow:0 8px 25px #86657757;min-height:52px;background:linear-gradient(135deg,#f4fff3,#ddf0df);color:#536d53;font-size:13px;font-weight:800;line-height:1.5;animation:pop .24s ease-out}
.stage-three-toast{left:9px;right:9px;bottom:9px;max-height:calc(100% - 18px);overflow-y:auto;overscroll-behavior:contain;padding:10px 11px;font-size:clamp(11px,3.2vw,13px);line-height:1.43;pointer-events:none;box-shadow:0 4px 14px #86657750;border-width:2px}
.toast.bad{background:linear-gradient(135deg,#fff6ed,#ffe1e0);color:#9b6063}
@keyframes pop{from{opacity:0;transform:scale(.91) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* stage two: bubble hunt */
.bubble-info{font-size:12px;color:#8a7175;text-align:center;padding:0 4px;font-weight:800}
.bubble-field{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;padding:13px;background:linear-gradient(165deg,#e4edf1,#fcecea 48%,#f6eedf 100%);position:relative;overflow:hidden}
.bubble-field:after{content:"";position:absolute;bottom:-70px;right:-45px;width:180px;height:180px;border:20px solid #fff8f05e;border-radius:50%;pointer-events:none}
.bubble{--c1:#fff4f9;--c2:#eeb1c9;--c3:#bc799e;position:relative;aspect-ratio:1/1;width:100%;max-height:100%;align-self:center;justify-self:center;border:2px solid #fff9fa;background:radial-gradient(circle at 28% 19%,#ffffffe8 0%,#ffffff45 15%,transparent 25%),linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c3));border-radius:47% 53% 51% 49% / 49% 45% 55% 51%;box-shadow:inset -7px -7px 12px #8c5a8240,inset 4px 5px 8px #fff9,0 5px 0 #a7849f44,0 7px 13px #89657a39;color:#6d5062;min-width:0;min-height:0;padding:8px 5px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(11px,3.2vw,14px);font-weight:1000;line-height:1.35;animation:none;transition:transform .22s,opacity .28s}
.bubble:nth-child(3n+2){--c1:#fffdf4;--c2:#f4dab0;--c3:#daa4ae}
.bubble:nth-child(3n+3){--c1:#f9fff4;--c2:#cbe1d0;--c3:#9ab9bf}
.bubble:active{transform:scale(.92)}
.bubble.cleared{animation:burst .35s ease both;opacity:0;pointer-events:none}
.bubble.protected{background:linear-gradient(135deg,#e3f4d9,#b8dbb1);color:#50704d}

@keyframes burst{0%{transform:scale(1);opacity:1}100%{transform:scale(1.32);opacity:0}}
/* stage three: interactive campus map */
.map-scene{flex:1;min-height:0;position:relative;overflow:hidden;border:4px solid #fff5e9;border-bottom:8px solid #d8b4a5;border-radius:24px;box-shadow:0 8px 18px #93685f32;background-image:linear-gradient(180deg,#fff9ed34,#fffcf017),var(--campus);background-size:cover;background-position:center}
.map-scene .map-vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#fffaf138,transparent 35%,#fff7ed33)}
.smoke-pin{--smoke:#d9ced8;position:absolute;left:var(--x);top:var(--y);width:64px;height:48px;transform:translate(-50%,-50%);border:0;background:none;filter:drop-shadow(0 5px 4px #755e5c4a);z-index:2;transition:.25s}
.smoke-pin .cloud-shape{display:block;position:absolute;inset:9px 4px 1px;border-radius:33px;background:linear-gradient(160deg,#f4ecf3,var(--smoke) 80%);border:2px solid #fff7ff;box-shadow:inset -4px -5px 5px #9c8e9a55}
.smoke-pin .cloud-shape:before{content:"";position:absolute;background:linear-gradient(#f7f1f7,#d3c8d0);width:30px;height:30px;border-radius:50%;top:-14px;left:8px;border:2px solid #fff7ff}
.smoke-pin .cloud-shape:after{content:"";position:absolute;background:linear-gradient(#f6eef7,#d3c8d0);width:30px;height:30px;border-radius:50%;top:-10px;right:2px;border:2px solid #fff7ff}
.smoke-pin.active{filter:drop-shadow(0 1px 5px #faed88);transform:translate(-50%,-50%) scale(1.16)}
.smoke-pin.done{pointer-events:none;filter:drop-shadow(0 3px 3px #59785166)}
.smoke-pin.done .cloud-shape{display:none}
.smoke-pin.done::after{content:'✿';position:absolute;left:10px;top:0;font-size:42px;color:#ffb1bd;text-shadow:0 2px #fff,0 4px #7aaf7a;animation:pop .3s}
.scene-dialog{border:2px solid #fff;border-radius:17px;padding:9px 12px;box-shadow:0 4px 0 #e9c8bf;background:#fffdf9;min-height:59px;display:flex;align-items:center;gap:8px;color:#825969;font-size:13px;line-height:1.35;font-weight:800}
.scene-dialog::before{content:'✦';color:#d29c7c;font-size:21px;flex:0 0 auto}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;flex:0 0 auto}
.tool{display:flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;background:linear-gradient(#fffef8,#fae9e5);border:2px solid #fff;border-bottom:5px solid #d8b0ad;border-radius:17px;min-height:72px;color:#7e5066;font-size:12px;font-weight:950;box-shadow:0 4px 9px #9e687322;line-height:1.2}
.tool svg{width:27px;height:27px;filter:drop-shadow(0 2px 0 #e0bcc2)}
.tool:active{transform:translateY(2px);border-bottom-width:3px}
/* success panels */
.success-page{justify-content:center;gap:12px;background-image:radial-gradient(circle at 13% 17%,#f4c6c9 0 5px,transparent 6px),radial-gradient(circle at 84% 23%,#ffe2a1 0 7px,transparent 8px),radial-gradient(circle at 16% 83%,#b9d5b0 0 5px,transparent 6px),radial-gradient(circle at 88% 76%,#f2bed8 0 5px,transparent 6px)}
.success-card{width:100%;max-height:100%;min-height:0;overflow:hidden;background:linear-gradient(155deg,#fffdf7,#fff4ee);border:3px solid #fff;border-radius:27px;box-shadow:0 7px 0 #e6c0b7,0 13px 25px #a477733e;padding:18px 14px 16px;display:flex;flex-direction:column;gap:12px}
.success-heading{display:flex;align-items:center;justify-content:center;gap:8px;margin:0;color:#86526a;font-weight:1000;font-size:clamp(26px,7.5vw,34px);text-shadow:0 2px #fff}

.summary-table{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;overflow:hidden;background:#fffefa;border:2px solid #eddbd8;border-radius:16px;font-size:12px;line-height:1.55}

.summary-table tr>:last-child{border-right:0}.summary-table tr:last-child>*{border-bottom:0}
.summary-table thead th{background:#f3dcde;color:#754b60;font-size:13px;text-align:center}

.summary-block{display:grid;grid-template-columns:1fr;gap:8px;min-height:0}
.summary-row{display:flex;gap:11px;align-items:center;background:#fffdf9;border:2px solid #f0e5df;border-radius:16px;padding:10px 11px;box-shadow:0 3px 0 #eedad1}
.summary-row .icon{flex:0 0 42px;width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:#fae5e3;color:#b47685;font-size:21px;font-weight:1000}

.summary-row p{margin:0;color:#826b72;font-size:12.5px;font-weight:650;line-height:1.48}
.next-btn{flex:0 0 auto;align-self:center;padding:12px 31px;border-radius:17px;background:linear-gradient(180deg,#a6cf9c,#79b37f);color:white;border:3px solid #f8fff1;border-bottom:6px solid #669a71;box-shadow:0 6px 15px #548c6140;font-size:18px;font-weight:1000}
.next-btn:active{transform:translateY(2px);border-bottom-width:4px}
.finish .brandbox{padding-top:min(14vh,120px)}
.finish .jelly-title{font-size:clamp(41px,11.6vw,64px)}
.finish .finish-msg{max-width:290px;margin:28px auto 0;background:#fffdf4ec;border:3px solid #fff;border-radius:20px;padding:15px 19px;box-shadow:0 5px 0 #e3bdba,0 8px 15px #9b6e7540;font-size:17px;font-weight:850;line-height:1.75;color:#775265}

function shuffleCopy(arr){const out=[...arr];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out}
function newCardOrder(){let order;do{order=shuffleCopy(L1)}
  while(order.every((c,i)=>c.id===L1[i].id)||order.slice(0,3).every(c=>c.side==='ban')||order.slice(0,3).every(c=>c.side==='regulated'));
  return order.map(c=>c.id);
}

function level1(){const left=L1.filter(c=>!S.sorted[c.id]);return `<div class="page law-stage"> <div class="play-bg"></div>${hud(1)}${quest('新興菸品法規知多少?','請分類六張法規事件卡。')}<main class="stage-body"><div class="sort-baskets">${basket('ban','違規禁止','')}${basket('regulated','依法管制','')}${basket('proposed','修法規劃','')}</div><section class="tray"><div class="tray-label"><span>將拖曳事件卡分類至正確的區域</span></div><div class="card-grid">${(S.l1Order.length?S.l1Order.map(id=>L1.find(c=>c.id===id)):L1).map(c=>S.sorted[c.id]?`<div class="puzzle-piece placeholder" aria-hidden="true"></div>`:`<button class="puzzle-piece ${S.chosen===c.id?'chosen':''}" data-action="choose" data-id="${c.id}">${c.label}</button>`).join('')}</div></section>${progress(Object.keys(S.sorted).length)}</main></div>`}
function success1(){return `<div class="page success-page"><div class="play-bg"></div><section class="success-card"><h1 class="success-heading">${SVG.star} 成功通關</h1><table class="summary-table" aria-label="電子煙與加熱菸法律差異"><thead><tr><th>比較</th><th>電子煙</th><th>加熱菸</th></tr></thead><tbody><tr><th>法規定位</th><td>類菸品，全面禁止</td><td>指定菸品，須經審查</td></tr><tr><th>製造與販售</th><td>禁止製造、輸入、販賣、供應、展示及廣告</td><td>須審查核准，才能依法製造、輸入、販售</td></tr><tr><th>使用規範</th><td>全面禁止使用，私人空間亦然</td><td>仍須遵守校園禁菸與年齡限制</td></tr><tr><th>持有新制</th><td>新增持有罰則仍屬修法規劃，尚未生效</td><td>未核准指定菸品的持有也列入修法規劃</td></tr></tbody></table><p class="minilabel" style="text-align:center;margin:0">未滿20歲者不得吸菸，任何人也不得供應菸品給未滿20歲者。</p><button class="next-btn" data-action="next2">下一關　➜</button></section></div>`}
function level2(){return `<div class="page shooter-page original-shooter-page"><div class="play-bg"></div>${hud(2)}<div class="original-shooter-title">新興菸品與二手菸危害</div><main class="original-shooter-holder"><iframe id="originalBubbleFrame" title="新興菸品與二手菸危害射泡泡遊戲" sandbox="allow-scripts" loading="eager"></iframe></main></div>`;}

  }
  function writeFeedback(text,kind){const el=phone.querySelector('#shooterFeedback');if(!el)return;el.textContent=text;el.className='shooter-feedback'+(kind?' '+kind:'');}
  function updateProgress(){const num=S.popped.length;const el=phone.querySelector('#shotProgress');if(el)el.textContent=`${num} / 6`;const fill=phone.querySelector('#shotFill');if(fill)fill.style.width=(num/6*100)+'%';const stars=phone.querySelector('#shootStars');if(stars){const n=wave.items.filter(c=>c.hazard&&S.popped.includes(c.id)).length;stars.textContent='★'.repeat(n)+'☆'.repeat(2-n)}const lives=phone.querySelector('#shotLives');if(lives)lives.textContent='♥'.repeat(G.lives)+'♡'.repeat(3-G.lives);}
  function pointerAngle(e){const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;return Math.max(-1.13,Math.min(1.13,Math.atan2(x-G.origin.x,G.origin.y-y)))}
  function onDown(e){if(shooter!==G||G.locked||G.shot)return;if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();G.pointer=e.pointerId;G.aim=pointerAngle(e);try{canvas.setPointerCapture(e.pointerId)}catch{}}
  function onMove(e){if(G.pointer!==e.pointerId)return;e.preventDefault();G.aim=pointerAngle(e)}
  function onUp(e){if(G.pointer!==e.pointerId)return;e.preventDefault();G.aim=pointerAngle(e);G.pointer=null;if(!G.locked&&!G.shot)fire();}
  function onCancel(e){if(G.pointer===e.pointerId)G.pointer=null}
  function fire(){
    G.shot={x:G.origin.x,y:G.origin.y-13,vx:Math.sin(G.aim)*10.3,vy:-Math.cos(G.aim)*10.3,age:0};G.locked=true;
    writeFeedback('發射！看準真正的健康危害泡泡。');
  }
  G.onDown=onDown;G.onMove=onMove;G.onUp=onUp;G.onCancel=onCancel;
  canvas.addEventListener('pointerdown',onDown);canvas.addEventListener('pointermove',onMove);canvas.addEventListener('pointerup',onUp);canvas.addEventListener('pointercancel',onCancel);
  G.resizeObserver=new ResizeObserver(layout);G.resizeObserver.observe(box);layout();updateProgress();
  function collide(t){
    const id=t.item.id;G.shot=null;G.locked=false;
    if(t.item.hazard){
      if(S.popped.includes(id))return;
      S.popped.push(id);G.hitId=id;G.hitUntil=performance.now()+450;haptic();
      writeFeedback('射中了！'+t.item.fact,'good');updateProgress();
      const correct=wave.items.filter(c=>c.hazard&&S.popped.includes(c.id)).length;
      if(correct===2){
        G.locked=true;S.waveBusy=true;
        S.navTimer=setTimeout(()=>{if(shooter!==G)return;S.waveBusy=false;if(S.wave===BUBBLE_WAVES.length-1)navigate('success2');else{S.wave++;navigate('level2')}},1350);
      }
    }else{
      G.lives=Math.max(0,G.lives-1);G.hitId=id;G.hitUntil=performance.now()+620;haptic(true);
      writeFeedback('這是錯誤迷思！'+t.item.fact,'bad');updateProgress();
      if(G.lives===0){G.locked=true;S.navTimer=setTimeout(()=>{if(shooter!==G)return;G.lives=3;G.locked=false;G.hitId=null;updateProgress();writeFeedback('重新補滿三顆愛心，再試一次！')},1300)}
    }
  }
  function handleMiss(){G.shot=null;G.locked=false;writeFeedback('沒有射中泡泡，調整角度再發射！')}
  function update(ts){
    if(shooter!==G)return;
    const dt=G.last?Math.min(2,(ts-G.last)/16.667):1;G.last=ts;
    const p=G.shot;
    if(p){
      const pieces=Math.max(1,Math.ceil(10.3*dt/6));
      for(let n=0;n<pieces;n++){
        p.x+=p.vx*dt/pieces;p.y+=p.vy*dt/pieces;p.age+=dt/pieces;
        if(p.x<13){p.x=26-p.x;p.vx=Math.abs(p.vx)}if(p.x>G.W-13){p.x=2*(G.W-13)-p.x;p.vx=-Math.abs(p.vx)}
        const t=G.targets.find(t=>!S.popped.includes(t.item.id)&&Math.hypot(t.x-p.x,t.y-p.y)<G.r+12);
        if(t){collide(t);break}
        if(p.y<-15||p.age>145){handleMiss();break}
      }
    }
    drawFrame(ts);G.raf=requestAnimationFrame(update);
  }
  function bubble(t,ts){
    if(S.popped.includes(t.item.id))return;
    const {x,y,ci,item}=t;const r=G.r;
    const active=G.hitId===item.id&&G.hitUntil>ts;
    const colors=SHOOT_COLORS[ci%SHOOT_COLORS.length];
    ctx.save();ctx.translate(x,y);
    ctx.shadowColor='#6c587047';ctx.shadowBlur=11;ctx.shadowOffsetY=6;
    const grad=ctx.createRadialGradient(-r*.35,-r*.5,3,0,0,r*1.25);
    grad.addColorStop(0,'#fffdfd');grad.addColorStop(.34,colors[0]);grad.addColorStop(1,colors[1]);
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowColor='transparent';
    ctx.lineWidth=active?4:2.5;ctx.strokeStyle=active?(item.hazard?'#6db784':'#d56e86'):'#fffdfb';ctx.stroke();
    ctx.fillStyle='#fff8';ctx.beginPath();ctx.ellipse(-r*.32,-r*.49,r*.21,r*.1,-.7,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#624c62';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    const font=Math.max(10.7,Math.min(15.5,r*.29));ctx.font=`900 ${font}px "Noto Sans TC","PingFang TC",sans-serif`;
    const label=SHOOT_SHORT[item.id]||item.label;
    const maxWidth=r*1.62;const chunks=[];
    let line='';for(const ch of label){const test=line+ch;if(ctx.measureText(test).width>maxWidth&&line){chunks.push(line);line=ch}else line=test}if(line)chunks.push(line);
    const lineH=font*1.32;const top=-(chunks.length-1)*lineH/2;
    chunks.forEach((txt,i)=>ctx.fillText(txt,0,top+i*lineH));
    ctx.restore();
  }
  function drawTrajectory(){
    let x=G.origin.x,y=G.origin.y-15;let vx=Math.sin(G.aim)*9,vy=-Math.cos(G.aim)*9;
    ctx.save();for(let i=0;i<30;i++){
      x+=vx*.72;y+=vy*.72;
      if(x<12){x=24-x;vx=Math.abs(vx)}if(x>G.W-12){x=2*(G.W-12)-x;vx=-Math.abs(vx)}
      if(y<15)break;
      if(G.targets.some(t=>!S.popped.includes(t.item.id)&&Math.hypot(t.x-x,t.y-y)<G.r+14))break;
      if(i%2===0){ctx.beginPath();ctx.arc(x,y,Math.max(2.6,G.r*.08),0,Math.PI*2);ctx.fillStyle='#b687aa9a';ctx.fill()}
    }ctx.restore();
  }
  function drawFrame(ts){
    const {W,H}=G;ctx.clearRect(0,0,W,H);
    // Soft scenic ground and stars, static so the interface does not jitter.
    ctx.fillStyle='#d8e8d69e';ctx.beginPath();ctx.ellipse(W*.4,H+14,W*.7,55,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ffffffb5';for(const [x,y] of [[.12,.16],[.89,.23],[.49,.30],[.07,.61],[.94,.71]]){ctx.beginPath();ctx.arc(W*x,H*y,3,0,Math.PI*2);ctx.fill()}
    G.targets.forEach(t=>bubble(t,ts));
    if(!G.shot)drawTrajectory();
    ctx.save();ctx.translate(G.origin.x,G.origin.y);ctx.rotate(G.aim);
    ctx.fillStyle='#b7899d';ctx.beginPath();ctx.ellipse(0,7,37,14,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#f3b7c4';ctx.strokeStyle='#fffef8';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(-17,-35,34,57,12);ctx.fill();ctx.stroke();
    ctx.fillStyle='#9f718b';ctx.fillRect(-11,-39,22,6);ctx.restore();
    if(G.shot){ctx.save();ctx.shadowColor='#f0a4c6b5';ctx.shadowBlur=16;ctx.fillStyle='#ffd8ed';ctx.strokeStyle='white';ctx.lineWidth=3;ctx.beginPath();ctx.arc(G.shot.x,G.shot.y,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
  }
  G.raf=requestAnimationFrame(update);
  window.__shooterDebug={get:()=>shooter&&({wave:S.wave,lives:shooter.lives,W:shooter.W,H:shooter.H,origin:shooter.origin,targets:shooter.targets.map(t=>({id:t.item.id,x:t.x,y:t.y,good:t.item.hazard})),shot:shooter.shot,popped:S.popped.slice()}),hit:(id)=>{const t=shooter?.targets.find(t=>t.item.id===id);if(t)collide(t)}};
}

function useTool(tool){if(S.target===null){showToast('請先點擊校園地圖上的煙霧！',true);return}const task=CAMPUS_TASKS.find(t=>t.id===S.target);if(!task)return;if(task.action!==tool){haptic(true);showToast('再想想，哪個守護道具最適合這個情境？',true);return}S.marked.push(task.id);S.target=null;haptic();if(S.marked.length===6){navigate('finish')}else{draw();showToast('守護成功！'+task.fact)}}
phone.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 if(S.paused&&!['resume','restart','home'].includes(b.dataset.action))return;
 switch(b.dataset.action){
 case 'start':case 'replay':freshStart();break;
 case 'restart':restartThisLevel();break;
 case 'pause':openPause();break;
 case 'resume':closePause(true);break;
 case 'home':case 'back':closePause(false);navigate('home');break;
 case 'choose':S.chosen=S.chosen===b.dataset.id?null:b.dataset.id;draw();break;
 case 'basket':sortInto(b.dataset.side);break;
 case 'spot':S.target=Number(b.dataset.id);draw();break;
 case 'tool':useTool(b.dataset.tool);break;
 case 'next2':navigate('level2');break;
 case 'next3':navigate('level3');break;
 }
});
// 真正跟隨手指／滑鼠的零件拖曳；點選卡片再點產品的操作仍保留。
let moving=null;
let suppressDragClickUntil=0;
let suppressDragClickId=null;
function removeDragGhost(){
  if(!moving)return;
  if(moving.ghost)moving.ghost.remove();
  if(moving.source&&moving.source.isConnected)moving.source.classList.remove('drag-origin');
  phone.querySelectorAll('.basket.drag-over').forEach(b=>b.classList.remove('drag-over'));
}
function updateDragPosition(x,y){
  if(!moving||!moving.dragging)return;
  moving.ghost.style.left=(moving.left + x-moving.startX)+'px';
  moving.ghost.style.top=(moving.top + y-moving.startY)+'px';
  const under=document.elementFromPoint(x,y);
  const area=under?.closest('.basket');
  if(moving.hover!==area){
    moving.hover?.classList.remove('drag-over');
    moving.hover=area;
    moving.hover?.classList.add('drag-over');
  }
}
function beginDrag(){
  if(!moving||moving.dragging)return;
  moving.dragging=true;
  const source=moving.source,rect=moving.rect;
  const ghost=source.cloneNode(true);
  ghost.removeAttribute('data-action');ghost.removeAttribute('data-id');ghost.removeAttribute('id');
  ghost.setAttribute('aria-hidden','true');ghost.tabIndex=-1;
  ghost.classList.remove('chosen');ghost.classList.add('dragging-ghost');
  Object.assign(ghost.style,{
    position:'fixed',top:rect.top+'px',left:rect.left+'px',width:rect.width+'px',height:rect.height+'px',
    margin:'0',zIndex:'99999',transform:'scale(1.07)',pointerEvents:'none',boxSizing:'border-box'
  });
  document.body.appendChild(ghost);moving.ghost=ghost;
  source.classList.add('drag-origin');
}
phone.addEventListener('pointerdown',e=>{
  const source=e.target.closest('.puzzle-piece[data-id]');
  if(!source||S.screen!=='level1'||(e.pointerType==='mouse'&&e.button!==0))return;
  if(moving)removeDragGhost();
  const rect=source.getBoundingClientRect();
  moving={id:source.dataset.id,pointerId:e.pointerId,source,rect,left:rect.left,top:rect.top,startX:e.clientX,startY:e.clientY,dragging:false,hover:null,ghost:null};
  // Pointer capture prevents losing the card when the finger moves outside its bounds.
  try{source.setPointerCapture(e.pointerId)}catch(_){}
});
phone.addEventListener('pointermove',e=>{
  if(!moving||e.pointerId!==moving.pointerId)return;
  const travel=Math.hypot(e.clientX-moving.startX,e.clientY-moving.startY);
  if(!moving.dragging&&travel>7)beginDrag();
  if(moving.dragging){e.preventDefault();updateDragPosition(e.clientX,e.clientY)}
},{passive:false});
phone.addEventListener('pointerup',e=>{
  if(!moving||e.pointerId!==moving.pointerId)return;
  const moved=moving.dragging,id=moving.id;
  if(moved){
    updateDragPosition(e.clientX,e.clientY);
    const dest=moving.hover?.dataset.side||document.elementFromPoint(e.clientX,e.clientY)?.closest('.basket')?.dataset.side;
    removeDragGhost();moving=null;
    suppressDragClickUntil=Date.now()+500;suppressDragClickId=id;
    if(dest){S.chosen=id;sortInto(dest)}
  }else{removeDragGhost();moving=null}
});
phone.addEventListener('pointercancel',e=>{
  if(!moving||e.pointerId!==moving.pointerId)return;
  removeDragGhost();moving=null;
});
phone.addEventListener('click',e=>{
  if(Date.now()<suppressDragClickUntil&&e.target.closest('.puzzle-piece')?.dataset.id===suppressDragClickId){e.preventDefault();e.stopImmediatePropagation()}
},true);

draw();
</script></body></html>
